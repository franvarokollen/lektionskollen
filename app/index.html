<!doctype html>
<html lang="sv" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lektionskollen</title>
<link rel="icon" href="./logo-white.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./lk.css">
</head>
<body>

<div class="shell" id="app">
  <aside class="sidebar">
    <div class="sb-top">
      <img src="./logo-white.svg" alt="FrånvaroKollen" class="sb-logo">
      <p class="sb-school" id="schoolname">…</p>
    </div>

    <div class="sb-nav-wrap">
      <p class="navlabel" data-t="navSection">Navigering</p>
      <nav class="nav" id="nav"></nav>
    </div>

    <div class="sb-divider"></div>

    <div class="sb-lang">
      <div class="langbox">
        <button class="langbtn" data-lang="sv">SV</button>
        <button class="langbtn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="sb-user">
      <div class="userrow">
        <div class="avatar" id="avatar">TS</div>
        <div class="userinfo"><p id="username">…</p></div>
        <button class="signout" id="signout" data-t="signOut">Logga ut</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pagetitle">Daglig vikarie</h1>
        <div class="sub mono" id="pagesub">—</div>
      </div>
      <div class="spacer"></div>
    </header>

    <div class="wrap">
      <section id="screen-cover">
        <div class="demo-tip">
          <span>▶</span>
          <div><b data-t="demoTipTitle">Delad testmiljö — ingen inloggning.</b> <span data-t="demoTipBody"></span></div>
        </div>
        <div class="tabs">
          <button class="on" data-t="tabDaily">Daglig vikarie</button>
          <button disabled data-t="tabSubs">Vikarier</button>
          <button disabled data-t="tabLongTerm">Långtidsfrånvaro</button>
        </div>
        <div class="panel"><div class="tablewrap">
          <table>
            <thead><tr>
              <th data-t="thTime">Tid</th><th data-t="thAbsent">Frånvarande</th>
              <th data-t="thGroup">Grupp</th><th data-t="thSubject">Ämne</th>
              <th data-t="thRoom">Rum</th><th data-t="thCover">Vikarie</th>
              <th style="text-align:right" data-t="thPlan">Lektionsplan</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div></div>
      </section>

      <section id="screen-bank" hidden>
        <div class="filters">
          <select id="f-subject"></select>
          <select id="f-year"></select>
          <select id="f-scope"></select>
          <span class="spacer"></span>
          <button class="btn btn-ghost btn-sm" id="refreshbank" data-t="refresh">Uppdatera</button>
        </div>
        <div class="grid" id="bankgrid"></div>
        <p class="note" data-t="thresholdNote"></p>
      </section>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="addin" role="dialog" aria-modal="true" aria-labelledby="addin-title">
    <div class="seam">
      <span class="tag">Lektionskollen</span>
      <span data-t="seam"></span>
      <span class="spacer"></span>
      <span id="seam-state">—</span>
    </div>
    <div id="addin-content"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./i18n.js"></script>
<script src="./lk.js"></script>
</body>
</html>
