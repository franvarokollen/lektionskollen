<style>
  /* The vikarie's page: no app chrome, no login, reads on a phone. */
  .subwrap{max-width:720px;margin:0 auto;padding-block:20px 120px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .subhead{background:var(--navy-deep);color:#e8edf2;border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .subhead h1{font-size:20px;letter-spacing:-.015em}
  .subhead .m{color:#9fb3c8;font-size:13px;margin-top:4px}
  .ratebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:22px}
  .langpick{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
  .langpick button{border:0;background:transparent;color:rgba(255,255,255,.5);border-radius:7px;
    padding:5px 12px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
  .langpick button.on{background:rgba(255,255,255,.18);color:#fff}
  .subhead-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .subhead-row > div:first-child{flex:1;min-width:0}
  .ratebox h3{font-size:15px;margin-bottom:4px}

  /* ── Layout: the page stops being a column ────────────────
     The old page was 720px centred, which left half a desktop screen empty
     while the "if it goes wrong" card sat three screens down — unreachable at
     exactly the moment it is needed. The margins now carry the two things a
     substitute looks sideways for: where they are in the lesson, and help. */
  /* render() writes into #out, so #out is the thing between .subwrap and the
     columns. display:contents lets its children be the grid items. */
  @media (min-width:1180px){
    .subwrap{max-width:1320px;display:grid;gap:26px 26px;align-items:start;
      grid-template-columns:210px minmax(0,1fr) 290px}
    #out{display:contents}
    .subwrap > .full{grid-column:1 / -1}
    .rail{position:sticky;top:18px;align-self:start}
    .rail-l{grid-column:1}
    .rail-r{grid-column:3}
  }
  @media (max-width:1179px){ .rail-l{display:none} .rail-r{order:99} }

  /* ── The margin rail ──────────────────────────────────────*/
  .nav{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
  .nav h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);
    margin:2px 4px 8px}
  .nav a{display:block;text-decoration:none;color:inherit;border-radius:8px;padding:7px 9px;
    font-size:12.5px;line-height:1.35;border-left:3px solid transparent}
  .nav a:hover{background:var(--line-soft)}
  .nav a .t{display:block;font:500 11px/1 'Geist Mono',ui-monospace,monospace;color:var(--ink-soft);
    margin-top:3px}
  .nav a.k-recall{border-left-color:#7b61a8} .nav a.k-model{border-left-color:#14407a}
  .nav a.k-together{border-left-color:#1d7a5f} .nav a.k-indep{border-left-color:#b07515}
  .nav a.k-exit{border-left-color:#8a3b4e}
  .where{font-size:12.5px;line-height:1.5}
  .where b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--ink-soft);margin-bottom:3px}

  /* ── Teach mode ───────────────────────────────────────────
     A substitute mid-lesson is not reading, they are performing. One phase,
     large type, answers in place, and a bar that does not move. */
  /* #out is the render target, so the teach view is a grandchild of .subwrap —
     hiding .subwrap's children would hide it too. In teach mode render() emits
     nothing else, so showing the view is all that is needed. */
  .teachview{display:none}
  body.teach .teachview{display:block}
  body.teach .subwrap{display:block;max-width:none;padding:0}
  body.teach{background:var(--paper)}
  .tv{max-width:900px;margin:0 auto;padding:18px 18px 110px}
  .tv .ph{border-left-width:6px;padding:22px 24px}
  .tv .ph-h strong{font-size:22px}
  .tv .ph-n{width:30px;height:30px;font-size:14px}
  .tv .ph-t{font-size:14px}
  .tv .say{font-size:18px;line-height:1.55;padding:13px 16px}
  .tv .qa .q{font-size:16px;padding:12px 14px}
  .tv .qa .a{font-size:15px;padding:12px 14px}
  .tv .model-b{font-size:16px;padding:13px 16px}
  .tv .model-s{font-size:15px;padding:13px 16px}
  .tv .meta{font-size:14px}
  .tvbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--navy-deep);
    color:#e8edf2;display:flex;align-items:center;gap:12px;padding:11px 16px;
    padding-bottom:max(11px,env(safe-area-inset-bottom,0px))}
  .tvbar .pos{font:500 13px/1 'Geist Mono',ui-monospace,monospace;color:#9fb3c8}
  .tvbar .sp{flex:1}
  .tvbar button{border:0;border-radius:9px;padding:10px 16px;font:inherit;font-size:14px;
    font-weight:600;cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
  .tvbar button:disabled{opacity:.35;cursor:default}
  .tvbar button.pri{background:#fff;color:var(--navy-deep)}
  .tvdots{display:flex;gap:5px}
  .tvdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28)}
  .tvdots i.on{background:#fff}

  /* ── Projector ────────────────────────────────────────────
     What the class sees. Answers never appear here. */
  .proj{position:fixed;inset:0;z-index:90;background:#0b1a2d;color:#f2f7fc;
    display:grid;place-items:center;padding:5vh 5vw}
  .proj pre{font:500 clamp(22px,4.2vw,56px)/1.45 'Geist Mono',ui-monospace,monospace;
    white-space:pre-wrap;margin:0;max-width:100%}
  .proj .cl{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.14);color:#fff;
    border:0;border-radius:9px;padding:9px 15px;font:inherit;font-size:14px;cursor:pointer}
  .proj .ttl{position:absolute;top:18px;left:22px;font-size:14px;color:#8fa9c4;letter-spacing:.04em}
  /* A deck, not a single card: the worked example is the thing most worth
     projecting and it only makes sense one step at a time. Drawn from the plan
     itself - no image generation, nothing to get subtly wrong, and it prints. */
  .proj .slide{display:grid;gap:3.2vh;justify-items:start;max-width:min(1400px,92vw)}
  .proj h2{font:600 clamp(28px,5vw,68px)/1.15 'Geist',system-ui,sans-serif;margin:0}
  .proj .lead{font:400 clamp(18px,2.4vw,32px)/1.4 'Geist',system-ui,sans-serif;color:#b9cde2;margin:0}
  .proj ol{font:500 clamp(20px,3.2vw,46px)/1.6 'Geist Mono',ui-monospace,monospace;
    margin:0;padding-left:1.6em;display:grid;gap:1.1vh}
  .proj .nav{position:absolute;bottom:18px;right:22px;display:flex;gap:8px;align-items:center}
  .proj .nav button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;
    padding:9px 16px;font:inherit;font-size:15px;cursor:pointer}
  .proj .nav button:disabled{opacity:.3;cursor:default}
  .proj .count{position:absolute;bottom:24px;left:22px;font-size:14px;color:#8fa9c4;
    font-variant-numeric:tabular-nums}
  .proj .endcard{justify-items:center;text-align:center;justify-self:center}
  .proj .nextpart{background:#2f7be0;color:#fff;border:0;border-radius:12px;padding:16px 28px;
    font:600 clamp(18px,2.4vw,30px)/1 'Geist',system-ui,sans-serif;cursor:pointer}
  .proj .divider h2{font-size:clamp(36px,6.5vw,90px)}
  .proj .step{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8fa9c4}

  @media print{ .rail,.tvbar,.proj{display:none!important} .subwrap{display:block;max-width:none} }

  /* ── Live assist ───────────────────────────────────────────
     Buttons sit ON the thing they act on, because the hard part
     mid-lesson is saying WHICH bit you mean. Placement answers it. */
  .assist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .assist button{border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;font-weight:500;
    cursor:pointer;line-height:1.5;-webkit-tap-highlight-color:transparent}
  .assist button:hover{border-color:#9fb3c8;color:var(--ink)}
  .assist button:active{transform:translateY(1px)}
  .assist button:disabled{opacity:.5;cursor:default}

  /* Whole-lesson asks aren't about a section, so they get their own bar,
     findable one-handed without scrolling. */
  .assistbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:10px max(14px,env(safe-area-inset-left,0px))
            max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
  .assistbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .assistbar .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:500}
  .assistbar button{border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--navy-deep);cursor:pointer}
  .assistbar button:active{transform:translateY(1px)}

  /* Results open OVER the plan, never inline — you must not lose your
     place in a document you are reading live. */
  .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(10,24,41,.45)}
  .sheet[hidden]{display:none!important}
  .sheet .card{background:#fff;width:100%;max-width:720px;max-height:88vh;overflow:auto;
    border-radius:16px 16px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom,0px))}
  @media(min-width:600px){.sheet{align-items:center}.sheet .card{border-radius:16px;max-height:84vh}}
  .sheet h3{font-size:17px;letter-spacing:-.01em;margin-bottom:2px;padding-right:34px}
  .sheet .src{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px}
  .sheet ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65}
  .sheet ol li{margin-bottom:7px}
  .sheet .x{position:absolute;top:14px;right:16px;border:0;background:transparent;
    font-size:19px;cursor:pointer;color:var(--ink-soft);line-height:1}
  .sheet .card{position:relative}
  .sheetfoot{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--navy-deep);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* What was generated earlier in this lesson, kept with its section. */
  .extra{border-left:3px solid #c9a227;background:#fffbf0;border-radius:0 8px 8px 0;
    padding:9px 12px;margin-top:9px;font-size:13px}
  .extra b{display:block;font-size:12.5px;margin-bottom:2px}
  .extra .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#8a6d12;font-weight:600}

  .reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .reasons button{border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink-soft)}
  .reasons button.on{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
  .bigpick{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
  .bigpick button{flex:1;min-width:140px;border:1px solid var(--line);background:#fff;
    border-radius:12px;padding:13px 16px;font:inherit;font-size:14.5px;font-weight:600;
    cursor:pointer;color:var(--ink)}
  .bigpick button.on{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}

  .note{margin-top:14px}
  .note label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
  .noterow{display:flex;gap:7px}
  .noterow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .noterow input:focus{outline:2px solid #0F71F6;outline-offset:-1px;border-color:transparent}
  .noterow button{border:1px solid var(--navy-deep);background:var(--navy-deep);color:#fff;
    border-radius:9px;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .noterow button:disabled{opacity:.45;cursor:default}


  .stbtn{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .stbtn:hover{background:var(--line-soft)}
  .stbtn.presentbtn{background:#1b5fc4;color:#fff;border-color:#1b5fc4;padding:10px 18px;font-size:15px;box-shadow:0 2px 6px rgba(27,95,196,.35)}
  .stbtn.presentbtn:hover{background:#154c9d}
  .strow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
  #student{position:fixed;inset:0;z-index:90;background:#fff;overflow:auto;padding:20px 16px 60px}
  #student .in{max-width:760px;margin:0 auto}
  #student h1{font-size:26px;margin:8px 0 4px}
  #student .bigboard{background:#15402e;color:#eef5ef;border-radius:12px;padding:18px 20px;white-space:pre-wrap;font-size:22px;line-height:1.5;margin:14px 0}
  #student ol{font-size:19px;line-height:1.7;padding-left:28px}
  #student h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:22px 0 4px}
  #student .mat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;white-space:pre-wrap;font-size:17px}
  #student .stbar{display:flex;gap:8px;flex-wrap:wrap}
  body.pst > :not(#student){display:none!important}
  @media print{
    body.pst #student{position:static;padding:0}
    #student .stbar{display:none}
    #student .bigboard{background:#fff;color:#000;border:2px solid #000;font-size:20px}
  }

  .qmode h1{font-size:22px}
  .covrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .covrow button{flex:1;min-width:110px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .covrow button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .onlyprint{display:none}
  .offl{background:#fff7e0;border:1px solid #e8d48a;border-radius:9px;padding:8px 12px;font-size:13px;margin:8px 0}
  @media print{
    .onlyprint{display:block;page-break-before:always}
    .stprint .bigboard{background:#fff;color:#000;border:2px solid #000;font-size:20px;white-space:pre-wrap;padding:14px;margin:12px 0}
    .stprint ol{font-size:17px;line-height:1.7}
    .stprint h2{font-size:13px;text-transform:uppercase;margin:16px 0 4px}
    .stprint .mat{border:1px solid #000;padding:8px 12px;margin:6px 0;white-space:pre-wrap}
    .ratebox,.noprint,.assist,.assistbar,.sheet,.note{display:none!important}
    .subhead{background:#fff;color:#000;border:1px solid #000}
    .subwrap{padding-bottom:20px}
  }

/* A plan the school already had, wrapped so the handover question still lands */
.embed{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.embed iframe{display:block;width:100%;height:min(70vh,620px);border:0}
a.openbtn{display:inline-flex;align-items:center;gap:6px;padding:11px 17px;border-radius:10px;font-weight:600;
  font-size:14px;background:var(--navy-deep);color:#fff;text-decoration:none;margin-top:4px}
a.openbtn:hover{opacity:.92;color:#fff}

/* Three questions, one tap each */
.qrow{margin:0 0 12px}
.qrow .ql{margin:0 0 6px;font-size:13.5px;font-weight:600;color:var(--ink)}
.qpick{display:flex;gap:7px;flex-wrap:wrap}
.qpick button{flex:1 1 30%;min-width:96px;padding:11px 10px;font:inherit;font-size:13px;font-weight:600;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.qpick button:hover{background:var(--line-soft)}
.qpick button.on{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}

.peek{margin-top:14px}
.peek>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--navy-deep);list-style:none;padding:8px 0}
.peek>summary::-webkit-details-marker{display:none}
.peek>summary::before{content:'▸ '}
.peek[open]>summary::before{content:'▾ '}

/* How much of the plan is written out */
.depthrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.depthrow .dl{font-size:12.5px;color:var(--ink-soft);margin-right:2px}
.depthrow button{padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.depthrow button.on{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
</style>

<script>
// ── Is this page the one we deployed? ─────────────────────
// GitHub Pages serves HTML with cache-control: max-age=600 and gives us no way
// to change that, so a link opened the day after it was sent can render the
// previous build. The page carries the build it was made from and asks.
//
// Two things make the answer trustworthy. cache:'no-store' keeps the browser
// from answering out of its own cache, and the timestamp makes the URL one the
// CDN has never seen, so it cannot answer from the edge either. Without the
// timestamp version.txt would be cached for the same ten minutes as the page it
// is meant to police.
//
// A failed fetch means offline, and offline is exactly when the cached page is
// the right thing to show. So it is ignored.
(function () {
  var BUILD = document.querySelector('meta[name="lk-build"]').content;
  if (!BUILD) return;
  try { if (sessionStorage.getItem('lk.sawBuild') === BUILD) return; } catch (e) { /* private window */ }
  fetch('./version.txt?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (live) {
      if (!live) return;
      live = live.trim();
      if (!live || live === BUILD) return;
      // Remember the build we are leaving, so a reload that somehow lands on it
      // again stops here instead of looping.
      try { sessionStorage.setItem('lk.sawBuild', BUILD); } catch (e) { /* ignore */ }
      var u = new URL(location.href);
      u.searchParams.set('_v', live);
      location.replace(u.toString());
    })
    .catch(function () { /* offline: the cached page is the point */ });
})();
</script>

<script>
const sb = window.supabase.createClient(
  'https://pbamabzbfbkxajntsrmc.supabase.co',
  'sb_publishable_XtMg3eLikZtI-UkNspIwcA_bWGvj428'
);
const params = new URLSearchParams(location.search);
const token = params.get('t');
let DATA = null;
let LINKED = null;
let TEACHER = null;
const ASPECTS = { reuse: '', clarity: '', timefit: '' };

/* The three questions save as they are tapped, so the second tap has to find
   the row the first one made — without claiming to be the previous substitute,
   whose answers must stand. A random id per share link, kept in this browser,
   keeps one substitute's three answers together and the next one's apart. */
const SESSION = (() => {
  const k = 'lk.sess.' + token;
  try {
    let v = localStorage.getItem(k);
    if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(k, v); }
    return v;
  } catch { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
})();
let EXTRAS = [];
let REASONS = new Set();

/* Where this substitute has got to: what is ticked off in Get ready, which
   steps are finished, whether the short version is on, and what they said
   about each step. Kept in this browser per share link, so a refresh halfway
   through the lesson does not send them back to step 1. */
const PROG = (() => {
  const base = { ready: {}, done: {}, short: false, sec: {} };
  try { return Object.assign(base, JSON.parse(localStorage.getItem('lk.prog.' + token) || '{}')); } catch { return base; }
})();
const saveProg = () => { try { localStorage.setItem('lk.prog.' + token, JSON.stringify(PROG)); } catch { /* private window */ } };
// The substitute may not read Swedish comfortably, so they pick, not the school.
let LANG = params.get('lang') || (() => { try { return localStorage.getItem('lk.lang') || ''; } catch { return ''; } })();

/* ── What the class teacher sees ─────────────────────────
   They are the only person in the chain who can tell whether the content was
   correct and whether it suited this particular class. The coordinator cannot
   — they are not a chemist — and the substitute can only report whether it was
   deliverable, which is a different question entirely.

   Kept to three taps and one optional line, because this is read between
   lessons by someone who has just come back from being ill. The plan itself is
   below the question so they can check it, but the question comes first. */
function renderTeacher(d) {
  const l = L();
  TEACHER = d;
  const all = { [d.language]: d.body };
  if (d.body_alt && d.language_alt) all[d.language_alt] = d.body_alt;
  const p = all[LANG] || all[d.language] || {};
  const said = d.substitute_said || [];
  const covText = { all: l.covAll, part: l.covPart, none: l.covNone };

  $('out').innerHTML =
    '<div class="card">' +
      '<span class="kicker">' + esc(l.tKicker) + '</span>' +
      '<h1>' + esc(p.title || d.title) + '</h1>' +
      '<p class="muted">' + esc(d.group_name) + ' · ' +
        esc(new Date(d.used_on).toLocaleDateString(LANG === 'sv' ? 'sv-SE' : 'en-GB',
          { weekday: 'long', day: 'numeric', month: 'long' })) +
        (d.substitute ? ' · ' + esc(d.substitute) : '') + '</p>' +
      (said.length
        ? '<div class="ps"><h3>' + esc(l.tSubSaid) + '</h3>' + said.map((x) =>
            '<p style="margin:4px 0">' +
            (x.coverage ? '<b>' + esc(covText[x.coverage] || x.coverage) + '.</b> ' : '') +
            (x.left_off ? esc(l.covLeftLbl) + ': ' + esc(x.left_off) + '. ' : '') +
            (x.comment ? esc(x.comment) : '') + '</p>').join('') + '</div>'
        : '') +
    '</div>' +

    '<div class="card ratebox noprint">' +
      '<h3>' + esc(l.tQuestion) + '</h3>' +
      '<p class="muted" style="margin:0 0 10px">' + esc(l.tWhy) + '</p>' +
      '<div class="qpick" id="tverdict">' +
        [['right', l.tRight], ['mostly', l.tMostly], ['wrong', l.tWrong]].map((o) =>
          '<button data-tv="' + o[0] + '"' + (d.teacher_verdict === o[0] ? ' class="on"' : '') +
          '>' + esc(o[1]) + '</button>').join('') + '</div>' +
      '<label for="tnote" style="display:block;font-size:13px;font-weight:600;margin:14px 0 5px">' +
        esc(l.tNoteLbl) + '</label>' +
      '<div class="noterow"><input id="tnote" type="text" maxlength="400" placeholder="' +
        esc(l.tNotePh) + '" value="' + esc(d.teacher_note || '') + '">' +
        '<button data-tnote>' + esc(l.send) + '</button></div>' +
      '<p class="hint" style="margin:6px 0 0">' + esc(l.tNoteHint) + '</p>' +
      '<p id="tmsg" class="hint" style="margin-top:10px"></p>' +
    '</div>' +

    '<div class="card"><h3>' + esc(l.tThePlan) + '</h3>' +
      '<p>' + esc(p.summary || '') + '</p>' +
      '<p style="font-size:13px;color:var(--ink-soft)"><b>' + esc(l.goal) + '</b> ' + esc(p.goal || '') + '</p>' +
      // Parenthesised deliberately: a bare ternary here takes the whole
      // concatenation above as its condition and throws the card away.
      ((p.tasks || []).length
        ? '<h4 style="margin-top:14px">' + esc(l.tasks) + '</h4><ol style="font-size:13.5px">' +
          (p.tasks || []).map((x) => '<li>' + esc(x.q) + '<br><span class="ans">' + esc(x.a) + '</span></li>').join('') +
          '</ol>'
        : '') +
    '</div>';
}

/* ── A plan the school already had ───────────────────────
   Wrapped rather than handed over as a bare link: the substitute still gets
   the school's framing, and the class teacher still gets told how far the
   lesson got. Nothing here is rated and nothing is banked — it is somebody
   else's work, and a score on a named colleague's lesson is a quarrel, not a
   signal.

   Google's editors refuse to be framed on their /edit URL but allow /preview,
   so those are rewritten. Everything else is offered as an embed with the
   plain link kept in front of it, because a site that refuses framing gives
   the page no way to find out. */
function embedUrl(u) {
  try {
    const url = new URL(u);
    const g = /^(docs|drive)\.google\.com$/.test(url.hostname);
    if (g) {
      const m = url.pathname.match(/^\/(document|presentation|spreadsheets|file)\/d\/([^/]+)/);
      if (m) {
        const base = 'https://' + url.hostname + '/' + m[1] + '/d/' + m[2];
        return m[1] === 'file' ? base + '/preview' : base + (m[1] === 'spreadsheets' ? '/preview' : '/preview');
      }
    }
    if (/^(.+\.)?onedrive\.live\.com$|sharepoint\.com$/.test(url.hostname)) return u;
    return u;
  } catch { return null; }
}

function renderLinked(d) {
  const l = L();
  LINKED = d;
  const emb = d.url ? embedUrl(d.url) : null;
  const what = d.label || (d.url ? l.linkedFrom : l.linkedNote);
  $('out').innerHTML =
    '<div class="card">' +
      '<span class="kicker">' + esc(l.linkedKicker) + '</span>' +
      '<h1>' + esc(what) + '</h1>' +
      // Typed instructions have no button to press, so they must not be told
      // to press one. The teacher's own words are never translated — they are
      // the teacher's, and a rough translation of a safety instruction is worse
      // than the original.
      '<p class="muted">' + esc(d.url ? l.linkedBody : l.noteBody) + '</p>' +
      (d.note ? '<div class="ps"><h3>' + esc(l.linkedNoteH) + '</h3><p style="white-space:pre-wrap">' + esc(d.note) + '</p></div>' : '') +
      (d.url
        // The button always works. The preview often does not — a document
        // shared only with the teacher, a site that refuses to be framed, and
        // nothing on this page can tell the difference from the outside. So it
        // is folded away: a substitute five minutes before the bell meets a
        // confident button, not somebody else's error page.
        ? '<p class="noprint"><a class="openbtn" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(l.linkedOpen) + ' ↗</a></p>' +
          (emb ? '<details class="peek noprint"><summary>' + esc(l.linkedPeek) + '</summary>' +
                 '<div class="embed"><iframe src="' + esc(emb) + '" title="' + esc(what) + '" loading="lazy"></iframe></div>' +
                 '<p class="hint">' + esc(l.linkedFallback) + '</p></details>' : '')
        : '') +
    '</div>' +
    '<div class="card ratebox noprint">' +
      '<h3>' + esc(l.covTitle) + '</h3>' +
      '<div class="covrow" id="covrow">' +
        ['all', 'part', 'none'].map((k) =>
          '<button data-lcov="' + k + '">' + esc(l[{ all: 'covAll', part: 'covPart', none: 'covNone' }[k]]) + '</button>').join('') + '</div>' +
      '<label for="leftoff" style="display:block;font-size:13px;font-weight:600;margin:12px 0 5px">' + esc(l.leftLbl) + '</label>' +
      '<div class="noterow"><input id="leftoff" type="text" maxlength="300" placeholder="' + esc(l.leftOff) + '">' +
        '<button data-lleft>' + esc(l.send) + '</button></div>' +
      '<p class="hint" style="margin:6px 0 0">' + esc(l.leftHint) + '</p>' +
      '<p id="lratemsg" class="hint" style="margin-top:10px"></p>' +
      '<p class="hint" style="margin:10px 0 0">' + esc(l.linkedNoRate) + '</p>' +
    '</div>';
}

/* ── Loading ─────────────────────────────────────────── */
async function load() {
  if (!token) { $('out').innerHTML = '<p class="muted">' + esc(L().noCode) + '</p>'; return; }

  // The class teacher's own door. Same link shape, different question: the
  // substitute is asked whether the lesson could be delivered, the teacher
  // whether it was right.
  if (params.get('as') === 'teacher') {
    const tv = await sb.rpc('lk_teacher_view', { p_token: token });
    if (tv.data) { renderTeacher(tv.data); return; }
  }

  // A teacher's own plan arrives through the same door as a generated one, so
  // the substitute never has to know which kind they were sent.
  const linked = await sb.rpc('lk_linked_by_token', { p_token: token });
  if (linked.data) { renderLinked(linked.data); return; }

  const [plan, extras] = await Promise.all([
    sb.rpc('lk_plan_by_token', { p_token: token }),
    sb.rpc('lk_extras_by_token', { p_token: token }),
  ]);
  const ck = 'lk.plan.' + token;
  if (plan.error && !plan.data) {
    try {
      const c = JSON.parse(localStorage.getItem(ck) || 'null');
      if (c && c.plan) { OFFLINE = true; EXTRAS = c.extras || []; render(c.plan); return; }
    } catch { /* no cache */ }
  }
  if (plan.error || !plan.data) {
    $('out').innerHTML =
      '<p class="muted">' + esc(L().notFound) + '</p>';
    return;
  }
  EXTRAS = Array.isArray(extras.data) ? extras.data : [];
  try { localStorage.setItem(ck, JSON.stringify({ plan: plan.data, extras: EXTRAS })); } catch { /* private window */ }
  render(plan.data);
}

function bodies(d) {
  const b = {};
  b[d.language || 'sv'] = d.body;
  if (d.body_alt && d.language_alt) b[d.language_alt] = d.body_alt;
  return b;
}

/* ── Live assist ─────────────────────────────────────── */
const KIND_LABEL = (k, variant) => {
  const l = L();
  if (k === 'explain') return l.aExplain;
  if (k === 'exercise') return l.aExercise;
  if (k === 'level') return variant === 'harder' ? l.aHarder : l.aEasier;
  return l.barLbl;
};

// Buttons that act on one part of the plan. section_ref is what turns a
// press into per-section signal later.
function assistRow(ref, label) {
  const l = L(), a = (k, v, txt) =>
    '<button data-assist="' + k + '" data-ref="' + esc(ref) + '"' +
    (v ? ' data-variant="' + v + '"' : '') +
    ' data-label="' + esc(label) + '">' + esc(txt) + '</button>';
  return '<div class="assist noprint">' +
    a('explain', '', l.aExplain) + a('exercise', '', l.aExercise) +
    a('level', 'easier', l.aEasier) + a('level', 'harder', l.aHarder) + '</div>';
}

// An extra carries both languages. Show the reader's; if only the other
// exists (an older row, or a model that skipped the translation), show it
// and say so rather than silently serving the wrong language.
function extraBody(x) {
  if (x.language === LANG) return { body: x.body, exact: true };
  if (x.language_alt === LANG && x.body_alt) return { body: x.body_alt, exact: true };
  return { body: x.body, exact: false, lang: x.language };
}

function extrasFor(ref) {
  const l = L();
  // An extra with nothing in the language being read would draw an empty box.
  // Also skip rows with nothing to show (old seed rows use a {h, steps}
  // shape): they drew a tag and an empty box.
  const hasContent = (b) => b && (b.title || (b.lines || []).length || b.board || (b.tasks || []).length);
  return EXTRAS.filter((x) => x.section_ref === ref && hasContent(extraBody(x).body)).map((x) => {
    const { body, exact, lang } = extraBody(x);
    const note = exact ? ''
      : ' · ' + esc(lang === 'sv' ? l.onlyOther : l.onlyOtherEn);
    return '<div class="extra"><span class="tag">' + esc(x.model === 'canned' ? l.simTag : l.genTag) + note + '</span>' +
      '<b>' + esc(body?.title || '') + '</b>' +
      '<ul style="margin:4px 0 0;padding-left:16px">' +
        (body?.lines || []).map((li) => '<li>' + esc(li) + '</li>').join('') +
      '</ul>' +
      (body?.board ? '<div class="board" style="margin-top:7px">' + esc(body.board) + '</div>' : '') +
      ((body?.tasks || []).length || body?.board
        ? '<div class="strow noprint"><button class="stbtn" data-student="x:' + x.id + '">' + esc(l.forStudents) + '</button></div>' : '') +
      '</div>';
  }).join('');
}

function sheetHtml(extra, source, saveNote, extraId, opts) {
  const l = L();
  const srcTxt = source === 'model' ? l.srcModel : source === 'cache' ? l.srcCache : source === 'fallback' ? l.srcFallback : l.srcLibrary;
  let h = '<h3>' + esc(extra.title) + '</h3><div class="src">' + esc(srcTxt) +
          (extra.minutes ? ' · ' + extra.minutes + ' min' : '') + '</div>';
  h += '<ol>' + (extra.lines || []).map((x) => '<li>' + esc(x) + '</li>').join('') + '</ol>';
  if (extra.board) h += '<h4 style="font-size:13px;margin-bottom:5px">' + esc(l.boardNow) + '</h4>' +
                        '<div class="board">' + esc(extra.board) + '</div>';
  if ((extra.tasks || []).length) {
    h += '<h4 style="font-size:13px;margin:14px 0 5px">' + esc(l.tasksNow) + '</h4>' +
         '<ol style="font-size:13.5px">' + extra.tasks.map((x) =>
           '<li>' + esc(x.q) + ' <span class="ans">' + esc(x.a) + '</span></li>').join('') + '</ol>';
  }
  h += '<div class="sheetfoot"><span class="hint">' + esc(saveNote) + '</span></div>';
  // Asked HERE, not at the end of the lesson: a substitute who just pressed
  // "explain another way" on phase 2 knows exactly what confused the class.
  // Ask an hour later and you get "it was ok".
  if (extraId) {
    h += '<div class="note"><label for="noteq">' + esc(l.whatHappened) + '</label>' +
         '<div class="noterow">' +
           '<input id="noteq" type="text" maxlength="240" placeholder="' + esc(l.whatHappenedPh) + '">' +
           '<button data-note="' + extraId + '" data-noteref="' + esc(opts?.ref || '') + '">' + esc(l.send) + '</button>' +
         '</div><p id="notemsg" class="hint" style="margin:7px 0 0"></p></div>';
  }
  return h;
}

async function runAssist(opts) {
  const l = L();
  $('sheetbody').innerHTML = '<h3><span class="spin"></span> ' + esc(l.working) + '</h3>';
  $('sheet').hidden = false;

  const p = currentBody();
  const payload = {
    kind: opts.kind,
    section_ref: opts.ref,
    section_label: opts.label,
    section_text: opts.text || '',
    variant: opts.variant || '',
    language: LANG,
    subject: DATA.subject,
    year_group: DATA.year_group,
    topic: p?.title || DATA.title,
    minutes_left: opts.minutes || undefined,
  };

  // Check the quota first. Once a real model is connected, a blocked
  // request must not cost a generation.
  const q = await sb.rpc('lk_assist_quota', { p_token: token });
  if (typeof q.data === 'number' && q.data <= 0) {
    $('sheetbody').innerHTML = '<h3>' + esc(l.quota) + '</h3>';
    return;
  }

  const { data, error } = await sb.functions.invoke('lk-assist', { body: payload });
  if (error || !data?.extra) {
    $('sheetbody').innerHTML = '<h3>' + esc(l.saveFail) + '</h3><p class="muted">' +
      esc(error?.message || 'unknown') + '</p>';
    return;
  }

  // Saved but flagged: the plan keeps improving, nothing enters the bank
  // unreviewed. The quota is enforced server-side, not here.
  const saved = await sb.rpc('lk_assist_save', {
    p_token: token,
    p_section_ref: opts.ref,
    p_section_label: opts.label || null,
    p_kind: opts.kind,
    p_variant: opts.variant || null,
    p_language: data.language || LANG,
    p_body: data.extra,
    p_model: data.model || null,
    p_body_alt: data.extra_alt || null,
    p_language_alt: data.extra_alt ? data.language_alt : null,
  });

  const ok = saved.data?.ok;
  const note = ok ? l.saved : saved.data?.error === 'quota' ? l.quota : '';
  $('sheetbody').innerHTML = sheetHtml(data.extra, data.source, note, ok ? saved.data.id : null, opts);

  if (ok) {
    EXTRAS.push({
      id: saved.data.id,
      section_ref: opts.ref, section_label: opts.label, kind: opts.kind,
      variant: opts.variant,
      language: data.language || LANG, body: data.extra,
      language_alt: data.extra_alt ? data.language_alt : null,
      body_alt: data.extra_alt || null,
    });
    render(DATA, true);
  }
}

function currentBody() {
  if (!DATA) return null;
  const all = bodies(DATA);
  return all[LANG] || all[DATA.language] || null;
}

/* ── Render ──────────────────────────────────────────── */
function render(d, keepScroll) {
  const y = keepScroll ? window.scrollY : 0;
  DATA = d;
  const all = bodies(d);
  if (!all[LANG]) LANG = d.language || Object.keys(all)[0];
  const p = all[LANG] || {};
  const choices = Object.keys(all);
  const l = L();

  if (QUICK) {
    let q = '<div class="qmode"><div class="subhead"><div class="subhead-row"><div><h1>' + esc(l.quickTitle) + ' — ' + esc(p.title) + '</h1>' +
      '<div class="m">' + esc(l.quickHint) + '</div></div></div></div>' +
      '<div class="strow noprint"><button class="stbtn" data-quick="0">' + esc(l.fullBtn) + '</button></div>' +
      '<div class="flag" style="background:#f0f5fb;color:#14407a"><span>①</span><div><b>' + esc(l.first90) + '</b><ul style="margin:6px 0 0;padding-left:18px">' +
        (p.first90||[]).map(x=>'<li>'+esc(x)+'</li>').join('') + '</ul></div></div>' +
      '<div class="ps"><h4>' + esc(l.board) + '</h4><div class="board">' + esc(p.board) + '</div>' +
      '<p style="margin-top:8px;font-size:13px"><b>' + esc(l.need) + '</b> ' + esc(p.equipment?.need) + '</p></div>' +
      '<div class="ps"><h4>' + esc(l.clock) + '</h4>' + (p.phases||[]).map((ph) =>
        '<p style="margin:4px 0;font-size:14px"><span class="clock">' + esc(ph.t) + '</span> <strong>' + esc(ph.n) + '</strong></p>').join('') + '</div>' +
      '<div class="strow noprint"><button class="stbtn" data-student="lesson">' + esc(l.studentSheet) + '</button></div></div>';
    $('out').innerHTML = q; $('bar').hidden = true;
    if (keepScroll) window.scrollTo(0, y);
    return;
  }

  const phases = p.phases || [];
  const hooks = {
    lbl: (k) => l[k],
    depth: DEPTH,
    assistRow: (ref, name) => assistRow(ref, name),
    extras: (ref) => extrasFor(ref),
    projector: true,
    help: false,                       // lifted into the margin rail below
    interactive: true,
    ready: PROG.ready, done: PROG.done, short: PROG.short,
  };

  // ── Teach mode: one phase, nothing else ──────────────────
  // A substitute mid-lesson is not reading, they are performing.
  if (TEACH) {
    const i = Math.max(0, Math.min(TPHASE, phases.length - 1));
    const one = LKPlan.render(p, Object.assign({}, hooks,
      { only: i, assistRow: () => '', extras: () => '' }));
    $('out').innerHTML =
      '<div class="teachview"><div class="tv">' + one + '</div>' +
      '<div class="tvbar"><button data-teach="0">' + esc(l.prepBtn) + '</button>' +
      '<button data-projdeck>' + esc(l.projDeck) + '</button>' +
      '<div class="tvdots">' + phases.map((_, j) =>
        '<i class="' + (j === i ? 'on' : '') + '"></i>').join('') + '</div>' +
      '<span class="pos">' + (i + 1) + ' ' + esc(l.phaseOf) + ' ' + phases.length + '</span>' +
      '<span class="sp"></span>' +
      '<button data-tph="' + (i - 1) + '"' + (i === 0 ? ' disabled' : '') + '>' + esc(l.prevPhase) + '</button>' +
      '<button class="pri" data-tph="' + (i + 1) + '"' + (i >= phases.length - 1 ? ' disabled' : '') + '>' +
        esc(l.nextPhase) + '</button></div></div>';
    document.body.classList.add('teach');
    $('bar').hidden = true;
    return;
  }
  document.body.classList.remove('teach');

  let h =
    '<div class="full">' +
    (d.model === 'canned' ? '<div class="offl noprint">' + esc(l.simBanner) + '</div>' : '') +
    (OFFLINE ? '<div class="offl noprint">' + esc(l.offlineNote) + '</div>' : '') +
    '<div class="subhead"><div class="subhead-row"><div>' +
    '<h1>' + esc(p.title) + '</h1>' +
    '<div class="m">' + esc(d.subject) + ' · ' + esc(d.year_group) + ' · ' + d.minutes + ' min · ' + esc(d.school) + '</div>' +
    '</div>' +
    (choices.length > 1
      ? '<div class="langpick noprint">' + choices.map((c) =>
          '<button data-pick="' + c + '"' + (c === LANG ? ' class="on"' : '') + '>' + (c === 'sv' ? 'SV' : 'EN') + '</button>').join('') + '</div>'
      : '') +
    '</div></div>' +
    '<div class="strow noprint"><button class="stbtn pri" data-teach="1">' + esc(l.teachBtn) + '</button>' +
    '<button class="stbtn" data-quick="1">' + esc(l.quickBtn) + '</button>' +
    '<button class="stbtn" data-student="lesson">' + esc(l.studentSheet) + '</button>' +
    '<button class="stbtn" data-pack>' + esc(l.packBtn) + '</button></div>' +
    '<div class="depthrow noprint"><span class="dl">' + esc(l.depthQ) + '</span>' +
    [['full', l.depthFull], ['guided', l.depthGuided], ['brief', l.depthBrief]].map((x) =>
      '<button data-depth="' + x[0] + '"' + (DEPTH === x[0] ? ' class="on"' : '') + '>' + esc(x[1]) + '</button>').join('') +
    '</div></div>';

  // Where you are in the lesson, in the left margin.
  h += '<aside class="rail rail-l noprint"><div class="nav"><h4>' + esc(l.railWhere) + '</h4>' +
    phases.map((ph, i) => '<a href="#ph' + i + '" class="' + LKPlan.kind(i) + '">' + esc(ph.n) +
      '<span class="t">' + esc(ph.t) + '</span></a>').join('') + '</div></aside>';

  h += '<main class="col">' + LKPlan.render(p, hooks) + '</main>';

  // Help lives in the right margin, because it is needed at the moment there is
  // no time to go looking for it.
  h += '<aside class="rail rail-r">' + LKPlan.help(p, hooks.lbl) + '</aside>';

  h += '<hr class="after-rule noprint">' +
    '<div class="full">' + LKPlan.after(p, hooks.lbl, hooks.extras) + '</div>';

  h += '<div class="full"><div class="onlyprint"><div id="studentprint" class="stprint">' + studentParts('lesson').html + '</div></div>';

  // ── Feedback ─────────────────────────────────────────────
  // Everything the substitute is asked, in one panel in a different colour, so
  // it is plain that it is not part of the lesson. Per step first (one tap
  // each), then how far they got, then the three questions. All optional, all
  // saved as they are tapped.
  const SECV = [['good', l.fbGood], ['ok', l.fbOk], ['bad', l.fbBad]];
  const STARS = Number(PROG.stars || 0);
  h += '<section class="fbpanel noprint" id="feedback">' +
    '<button class="fb-open" data-fbtoggle aria-expanded="' + (PROG.fbopen ? 'true' : 'false') + '">' +
      '<span><b>' + esc(l.fbOpen) + '</b><small>' + esc(l.fbOpenSub) + '</small></span><i class="fb-caret">&#9662;</i></button>' +

    '<p class="fb-intro">' + esc(l.fbIntro) + '</p>' +
    '<h4>' + esc(l.fbSteps) + '</h4>' +
    phases.map((ph, i) => {
      const ref = 'phase:' + i, cur = PROG.sec[ref] || {};
      return '<div class="fb-row" data-fbrow="' + ref + '">' +
        '<div class="fb-top"><div class="fb-lbl"><span class="fb-n">' + (i + 1) + '</span>' + esc(ph.n) + '</div>' +
        '<div class="fb-pick">' + SECV.map((o) =>
          '<button data-sec="' + ref + '|' + o[0] + '" class="fb-' + o[0] + (cur.v === o[0] ? ' on' : '') + '">' + esc(o[1]) + '</button>').join('') +
          '<button data-sec="' + ref + '|skipped" class="fb-skipped' + (cur.v === 'skipped' ? ' on' : '') + '">' + esc(l.fbSkipped) + '</button></div></div>' +
        '<div class="fb-note"' + (cur.v === 'ok' || cur.v === 'bad' ? '' : ' hidden') + '>' +
          '<input type="text" maxlength="300" placeholder="' + esc(l.fbNotePh) + '" value="' + esc(cur.note || '') + '" data-secnote-in="' + ref + '">' +
          '<button data-secnote="' + ref + '">' + esc(l.send) + '</button></div></div>';
    }).join('') +
    '<h4>' + esc(l.fbStarsQ) + '</h4>' +
    '<div class="fb-stars" id="fbstars" role="radiogroup"><span class="fb-sl">' + esc(l.fbStar1) + '</span>' +
      [1, 2, 3, 4, 5].map((n) => '<button data-star="' + n + '" class="' + (n <= STARS ? 'on' : '') + '" aria-label="' + n + '">&#9733;</button>').join('') +
      '<span class="fb-sl">' + esc(l.fbStar5) + '</span></div>' +
    [['reuse', l.qReuse, [['yes', l.aReuseYes], ['changes', l.aReuseChanges], ['no', l.aReuseNo]]]]
      .map(function (q) {
        return '<div class="qrow"><p class="ql">' + esc(q[1]) + '</p><div class="qpick" id="q-' + q[0] + '">' +
          q[2].map(function (o) {
            return '<button data-asp="' + q[0] + ':' + o[0] + '"' + (ASPECTS[q[0]] === o[0] ? ' class="on"' : '') +
              '>' + esc(o[1]) + '</button>';
          }).join('') + '</div></div>';
      }).join('') +
    '<h4>' + esc(l.covTitle) + '</h4><div class="covrow" id="covrow">' +
       ['all', 'part', 'none'].map((k) => '<button data-cov="' + k + '"' + (COV === k ? ' class="on"' : '') + '>' +
         esc(l[{ all: 'covAll', part: 'covPart', none: 'covNone' }[k]]) + '</button>').join('') + '</div>' +
       '<label for="leftoff" style="display:block;font-size:13px;font-weight:600;margin:12px 0 5px">' + esc(l.leftLbl) + '</label>' +
       '<div class="noterow"><input id="leftoff" type="text" maxlength="300" placeholder="' + esc(l.leftOff) + '" value="' + esc(LEFT) + '">' +
       '<button data-leftoff>' + esc(l.send) + '</button></div>' +
       '<p class="hint" style="margin:6px 0 0">' + esc(l.leftHint) + '</p>' +
       '<div id="why" hidden><p class="hint" style="margin:14px 0 0">' + esc(l.whyTitle) + '</p>' +
         '<div class="reasons">' + Object.keys(l.reasons).map((k) =>
           '<button data-reason="' + k + '">' + esc(l.reasons[k]) + '</button>').join('') + '</div></div>' +
       '<div id="saybox" hidden class="note" style="margin-top:14px">' +
         '<label for="say">' + esc(l.commentTitle) + '</label>' +
         '<div class="noterow">' +
           '<input id="say" type="text" maxlength="400" placeholder="' + esc(l.commentPh) + '">' +
           '<button data-comment>' + esc(l.send) + '</button>' +
         '</div></div>' +
       '<p id="ratemsg" class="hint" style="margin-top:10px"></p></div></section>';

  $('out').innerHTML = h;
  $('barlbl').textContent = l.barLbl;
  $('fbjump').textContent = l.fbJump;
  $('bar').hidden = false;
  if (keepScroll) window.scrollTo(0, y);
}

/* ── Student sheet: what the pupils see, never the answers ─── */
let STUDENT_TXT = '';
let QUICK = false, OFFLINE = false, COV = '', LEFT = '';
// Teach mode is deliberately NOT remembered across visits: it is a thing you
// start when the class walks in, not a setting you live in.
let TEACH = false, TPHASE = 0;

/* ── How much is written out ─────────────────────────────
   Substitutes are not interchangeable. One is eighteen and has never stood in
   front of a class; another taught the subject for twenty years and needs the
   outline, not a script. The same plan serves both by collapsing, rather than
   being written three times — so a plan in the bank stays usable by anyone,
   and the reader can change depth mid-lesson when confidence runs out at
   minute thirty.

   The control asks how much they want written out, never what they are
   qualified to teach. Nobody should have to declare themselves untrained to a
   web page, and a question like that gets answered dishonestly anyway. The
   default is everything: the confident teacher opts up, the nervous teenager
   does nothing and is covered. */
let DEPTH = (() => { try { return localStorage.getItem('lk.depth') || 'full'; } catch { return 'full'; } })();
// Which tier the pupil sheet prints. The sheet itself never says which — a
// pupil handed "More support" at the top of the page has been told something
// about themselves that they did not ask to be told.
let STIER = 'core';

function studentParts(which) {
  const l = L();
  const p = bodies(DATA)[LANG] || {};
  let title, board, tasks, mats = [], exit = '';
  if (which === 'lesson') {
    title = p.title; board = p.board;
    tasks = (p.tasks || []).filter((x) => (x.tier || 'core') === STIER).map((x) => x.q);
    mats = p.materials || []; exit = p.exit?.q || '';
  } else {
    const x = EXTRAS.find((e) => String(e.id) === which.slice(2));
    const { body } = extraBody(x || {});
    title = body?.title; board = body?.board; tasks = (body?.tasks || []).map((q) => q.q);
  }
  const txt = [title, '', board, ''].concat(mats.map((m) => m.h + '\n' + m.body + '\n'))
    .concat(tasks.map((q, i) => (i + 1) + '. ' + q)).concat(exit ? ['', l.exit + ': ' + exit] : []).join('\n').trim();
  let h = '<h1>' + esc(title || '') + '</h1>';
  if (board) h += '<div class="bigboard">' + esc(board) + '</div>';
  mats.forEach((m) => { h += '<h2>' + esc(m.h) + '</h2><div class="mat">' + esc(m.body) + '</div>'; });
  if (tasks.length) h += '<h2>' + esc(l.tasksNow.replace(/ med facit| with answers/i, '')) + '</h2><ol>' + tasks.map((q) => '<li>' + esc(q) + '</li>').join('') + '</ol>';
  if (exit) h += '<h2>' + esc(l.exit) + '</h2><p style="font-size:19px">' + esc(exit) + '</p>';
  return { html: h, txt };
}

function openStudent(which) {
  const l = L();
  const { html, txt } = studentParts(which);
  STUDENT_TXT = txt;
  const p = bodies(DATA)[LANG] || {};
  const has = (k) => (p.tasks || []).some((x) => (x.tier || 'core') === k);
  const picker = which !== 'lesson' || !(has('support') || has('extension')) ? '' :
    '<span class="stier">' + esc(l.tierQ) + '</span>' +
    [['support', l.tierSupport], ['core', l.tierStandard], ['extension', l.tierChallenge]]
      .filter((x) => has(x[0]))
      .map((x) => '<button class="stbtn' + (STIER === x[0] ? ' on' : '') + '" data-stier="' + x[0] + '">' +
        esc(x[1]) + '</button>').join('');
  const h = '<div class="in"><div class="stbar noprint">' + picker +
          '<span class="stsp"></span>' +
          '<button class="stbtn" data-stprint>' + esc(l.print) + '</button>' +
          '<button class="stbtn" data-stcopy>' + esc(l.copyText) + '</button>' +
          '<button class="stbtn" data-stclose>' + esc(l.close) + '</button></div>' + html + '</div>';
  let el = document.getElementById('student');
  if (!el) { el = document.createElement('div'); el.id = 'student'; document.body.appendChild(el); }
  el.innerHTML = h; el.hidden = false; el.scrollTop = 0;
  document.body.classList.add('pst');
}
function closeStudent() {
  const el = document.getElementById('student');
  if (el) el.hidden = true;
  document.body.classList.remove('pst');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeStudent(); });

/* ── Events ──────────────────────────────────────────── */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const b = document.querySelector('.proj');
    if (b) { b.remove(); DECK = null; return; }
    if (TEACH && DATA) { TEACH = false; render(DATA); return; }
  }
  // While the deck is up it owns the arrow keys: someone stepping through a
  // worked example in front of a class should not have to find a button.
  if (document.querySelector('.proj') && DECK) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault(); DI++; paintSlide(); return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault(); DI--; paintSlide(); return;
    }
    return;
  }
  if (!TEACH || !DATA) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { TPHASE++; render(DATA); window.scrollTo(0, 0); }
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   { TPHASE = Math.max(0, TPHASE - 1); render(DATA); window.scrollTo(0, 0); }
});

  /* ── The lesson, as slides ─────────────────────────────
     Built from the plan's own fields, so there is nothing to generate and
     nothing to get subtly wrong. A generated picture of a right-angled
     triangle with the legs mislabelled is worse than no picture, and you
     cannot check five hundred of them; a slide drawn from the data is correct
     by construction, costs nothing, and prints.

     The worked example is the reason this exists. It is the one part of a
     lesson that only works revealed a step at a time, and before this it was
     a block of text on a substitute's phone.

     What is NEVER on a slide: the worked example's final answer, a task
     answer, the exit ticket answer, a tier name. The class sees the questions;
     the adult keeps the answers. */
  /** Is this text already on a slide, whole or in pieces? The generator
   *  repeats itself by design - a phase's board restates the worked example's
   *  steps, the exit phase's board is the exit question - and a deck that
   *  shows the same thing twice teaches a class to stop looking up. */
  function already(S, txt) {
    if (!txt || !txt.trim()) return true;
    var t = txt.trim();
    return S.some(function (sl) {
      var hay = [sl.h, sl.pre].concat(sl.items || []).filter(Boolean).join('\n').trim();
      if (!hay) return false;
      if (hay.indexOf(t) !== -1) return true;
      // A board that is the task list written out: the questions are the same,
      // but the board numbers them ("1. ", "2. ") so neither string contains
      // the other. One question in common is enough to know.
      if (sl.items && sl.items.length && t.indexOf(sl.items[0]) !== -1) return true;
      // A board built out of lines that are each already a slide of their own.
      return hay.length > 8 && t.indexOf(hay) !== -1;
    });
  }

  function deckOf(p, l) {
    var S = [];
    var phases = p.phases || [];
    var cur = -1;
    // Every slide records which section it belongs to. Without that a section
    // button can only guess where to land, and guessed wrong (slide 1) whenever
    // dedup removed that section's board.
    var add = function (sl) { sl.ph = cur; sl.pn = phases.length; S.push(sl); };
    var push = function (sl) {
      var txt = sl.pre || sl.h;
      if (sl.items || !already(S, txt)) add(sl);
    };

    if (p.title) add({ h: p.title, lead: p.goal || '' });

    phases.forEach(function (ph, i) {
      cur = i;
      // Phase 2 is the worked example wherever it sits in the plan. Its steps
      // go up one at a time - the reason this is a deck and not a card.
      if (i === 1 && p.model && p.model.p) {
        push({ step: l.projModel, h: p.model.p });
        (p.model.st || []).forEach(function (st, j) {
          if (st && st.b) add({ step: l.projStep + ' ' + (j + 1), pre: st.b });
        });
        // p.model.a is deliberately absent: the answer is the substitute's.
      }

      // Phase 4 is independent work. The class copies the core tier; the tier
      // is not named on the slide any more than on a pupil's sheet.
      var core = [];
      if (i === 3) {
        core = (p.tasks || []).filter(function (x) { return (x.tier || 'core') === 'core'; });
        if (!core.length) core = (p.tasks || []);
      }
      // Tasks before this phase's board, deliberately: the generator writes
      // the same questions into both, and a numbered list reads better from
      // the back of a room than a copied-out block. Pushing it first lets
      // already() drop the board.
      for (var k = 0; k < core.length; k += 5) {
        add({ step: l.projTasks, items: core.slice(k, k + 5).map(function (x) { return x.q; }) });
      }
      // The first section's board is a note about what the pupils should
      // already know ("Att eleverna kan..."), written for the adult, and in some
      // plans it states the answer to its own starter question. What the class
      // needs to see there is the questions. They are the plan's own check
      // questions - never the answers.
      var starters = i === 0 ? (ph.checks || []).map(function (c) { return c && c.q; }).filter(Boolean) : [];
      if (starters.length) add({ step: ph.n, items: starters });
      else if (ph.board) push({ step: ph.n, pre: ph.board });
    });

    // The exit question belongs to the last section, so it is shown with it.
    if (p.exit && p.exit.q) { cur = Math.max(0, phases.length - 1); push({ step: l.projExit, h: p.exit.q }); }

    // A section whose board was a repeat of something already up still needs a
    // slide of its own, or its button has nowhere to land.
    phases.forEach(function (ph, i) {
      if (!S.some(function (sl) { return sl.ph === i; })) {
        var at = S.length;
        for (var k = 0; k < S.length; k++) { if (S[k].ph > i) { at = k; break; } }
        S.splice(at, 0, { step: ph.n, h: ph.n, ph: i, pn: phases.length });
      }
    });
    return S;
  }

  /** One section on its own: its slides, then a stop screen. The stop is the
   *  point - Next never runs on into the next section's slides, so the
   *  teacher has finished presenting before the class sees what comes next. */
  function deckScope(p, l, i) {
    var phases = p.phases || [];
    var out = deckOf(p, l).filter(function (sl) { return sl.ph === i; });
    var nx = phases[i + 1];
    out.push({ end: true, ph: i, pn: phases.length, nextPh: nx ? i + 1 : -1, nextName: nx ? nx.n : '' });
    return out;
  }

  /** The whole lesson, with a divider where each section begins. */
  function deckAll(p, l) {
    var phases = p.phases || [];
    var out = [], last = -2;
    deckOf(p, l).forEach(function (sl) {
      if (sl.ph >= 0 && sl.ph !== last) {
        out.push({ divider: true, h: (phases[sl.ph] || {}).n || '', ph: sl.ph, pn: phases.length });
      }
      last = sl.ph;
      out.push(sl);
    });
    return out;
  }

  var DECK = null, DI = 0;

  function slideHtml(sl, i, n, l) {
    var part = sl.ph >= 0 && sl.pn
      ? '<span class="ttl">' + esc(l.projPart.replace('{i}', sl.ph + 1).replace('{n}', sl.pn)) + '</span>' : '';
    var body;
    if (sl.end) {
      body = '<div class="slide endcard">' +
        '<span class="step">' + esc(l.projEnd) + '</span>' +
        '<h2>' + esc(sl.nextPh >= 0 ? l.projStop : l.projDone) + '</h2>' +
        (sl.nextPh >= 0
          ? '<button class="nextpart" data-projpart="' + sl.nextPh + '">' + esc(l.projNextPart) + ': ' + esc(sl.nextName) + ' ›</button>'
          : '') +
        '</div>';
    } else if (sl.divider) {
      body = '<div class="slide divider"><span class="step">' +
        esc(l.projPart.replace('{i}', sl.ph + 1).replace('{n}', sl.pn)) + '</span><h2>' + esc(sl.h) + '</h2></div>';
    } else {
      body = '<div class="slide">' +
        (sl.step ? '<span class="step">' + esc(sl.step) + '</span>' : '') +
        (sl.h ? '<h2>' + esc(sl.h) + '</h2>' : '') +
        (sl.lead ? '<p class="lead">' + esc(l.projGoal) + ': ' + esc(sl.lead) + '</p>' : '') +
        (sl.pre ? '<pre>' + esc(sl.pre) + '</pre>' : '') +
        (sl.items ? '<ol>' + sl.items.map(function (q) {
          return '<li>' + esc(q) + '</li>'; }).join('') + '</ol>' : '') +
        '</div>';
    }
    // The stop screen is not a numbered slide: the count is of what to present.
    var shown = DECK.filter(function (x) { return !x.end; }).length;
    return part + body +
      (sl.end ? '' : '<span class="count">' + (i + 1) + ' / ' + shown + '</span>') +
      '<button class="cl" data-projclose>' + esc(l.projHint) + '</button>' +
      '<div class="nav">' +
        '<button data-projgo="-1"' + (i === 0 ? ' disabled' : '') + '>' + esc(l.projPrev) + '</button>' +
        '<button data-projgo="1"' + (i === n - 1 ? ' disabled' : '') + '>' + esc(l.projNext) + '</button>' +
      '</div>';
  }

  function paintSlide() {
    var box = document.querySelector('.proj');
    if (!box || !DECK || !DECK.length) return;
    DI = Math.max(0, Math.min(DI, DECK.length - 1));
    box.innerHTML = slideHtml(DECK[DI], DI, DECK.length, L());
  }

  /** scope: a section number shows that section alone, ending on a stop
   *  screen; 'all' shows the whole lesson with dividers. */
  function openDeck(scope) {
    var all = bodies(DATA); var pp = all[LANG] || {};
    DECK = scope === 'all' ? deckAll(pp, L()) : deckScope(pp, L(), scope);
    if (!DECK.length) return;
    DI = 0;
    var old = document.querySelector('.proj');
    if (old) old.remove();
    var box = document.createElement('div');
    box.className = 'proj';
    document.body.appendChild(box);
    paintSlide();
  }

document.addEventListener('click', async (e) => {
  const l = L();

  const sti = e.target.closest('[data-stier]');
  if (sti) { STIER = sti.getAttribute('data-stier'); openStudent('lesson'); return; }

  const st = e.target.closest('[data-student],[data-stprint],[data-stcopy],[data-stclose]');
  if (st) {
    if (st.hasAttribute('data-student')) return openStudent(st.getAttribute('data-student'));
    if (st.hasAttribute('data-stclose')) return closeStudent();
    if (st.hasAttribute('data-stprint')) return window.print();
    try { await navigator.clipboard.writeText(STUDENT_TXT); st.textContent = l.copiedTxt; setTimeout(() => { st.textContent = l.copyText; }, 1600); }
    catch { /* clipboard blocked */ }
    return;
  }

  // ── Progress through the lesson ────────────────────────
  const rd = e.target.closest('[data-ready]');
  if (rd && DATA) { const k = rd.getAttribute('data-ready'); PROG.ready[k] = !PROG.ready[k]; saveProg(); render(DATA, true); return; }
  const sd = e.target.closest('[data-stepdone]');
  if (sd && DATA) {
    const i = Number(sd.getAttribute('data-stepdone'));
    PROG.done[i] = true; saveProg(); render(DATA, true);
    const nx = document.querySelector('.ph-cur') || $('feedback');
    if (nx) nx.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const sr = e.target.closest('[data-stepre]');
  if (sr && DATA) { delete PROG.done[Number(sr.getAttribute('data-stepre'))]; saveProg(); render(DATA, true); return; }
  if (e.target.closest('[data-short]') && DATA) { PROG.short = !PROG.short; saveProg(); render(DATA, true); return; }
  if (e.target.closest('[data-fbjump]')) {
    PROG.fbopen = true;
    const bd = document.querySelector('#feedback .fb-body'); if (bd) bd.hidden = false;
    const tg = document.querySelector('#feedback [data-fbtoggle]'); if (tg) tg.setAttribute('aria-expanded', 'true');
    const f = $('feedback'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); return;
  }

  // ── Per-step feedback ──────────────────────────────────
  const sb1 = e.target.closest('[data-sec]');
  if (sb1) {
    const [ref, verdict] = sb1.getAttribute('data-sec').split('|');
    const idx = Number(ref.split(':')[1]);
    const label = ((bodies(DATA)[LANG] || {}).phases || [])[idx]?.n || ref;
    PROG.sec[ref] = Object.assign({}, PROG.sec[ref], { v: verdict }); saveProg();
    const row = sb1.closest('[data-fbrow]');
    [...row.querySelectorAll('[data-sec]')].forEach((b) => b.classList.toggle('on', b === sb1));
    row.querySelector('.fb-note').hidden = !(verdict === 'ok' || verdict === 'bad');
    const { error } = await sb.rpc('lk_rate_section_by_token', {
      p_token: token, p_session: SESSION, p_ref: ref, p_label: label, p_verdict: verdict, p_note: null,
    });
    $('ratemsg').textContent = error ? l.saveFail + error.message : '';
    return;
  }
  const stb = e.target.closest('[data-star]');
  if (stb) {
    const n = Number(stb.getAttribute('data-star'));
    PROG.stars = n; saveProg();
    [...document.querySelectorAll('#fbstars [data-star]')].forEach((b) => b.classList.toggle('on', Number(b.getAttribute('data-star')) <= n));
    const { error } = await sb.rpc('lk_rate_stars_by_token', { p_token: token, p_session: SESSION, p_stars: n });
    $('ratemsg').textContent = error ? l.saveFail + error.message : l.thanks;
    return;
  }
  const ftg = e.target.closest('[data-fbtoggle]');
  if (ftg) {
    PROG.fbopen = !PROG.fbopen;
    ftg.setAttribute('aria-expanded', PROG.fbopen ? 'true' : 'false');
    const bd = document.querySelector('#feedback .fb-body'); if (bd) bd.hidden = !PROG.fbopen;
    return;
  }
  const sn = e.target.closest('[data-secnote]');
  if (sn) {
    const ref = sn.getAttribute('data-secnote');
    const inp = document.querySelector('[data-secnote-in="' + ref + '"]');
    const val = (inp?.value || '').trim();
    if (!val) return;
    const idx = Number(ref.split(':')[1]);
    const label = ((bodies(DATA)[LANG] || {}).phases || [])[idx]?.n || ref;
    PROG.sec[ref] = Object.assign({}, PROG.sec[ref], { note: val }); saveProg();
    const { error } = await sb.rpc('lk_rate_section_by_token', {
      p_token: token, p_session: SESSION, p_ref: ref, p_label: label, p_verdict: PROG.sec[ref].v || 'ok', p_note: val,
    });
    sn.textContent = error ? '!' : l.fbSavedS;
    return;
  }

  const qk = e.target.closest('[data-quick]');
  if (qk && DATA) { QUICK = qk.getAttribute('data-quick') === '1'; render(DATA); window.scrollTo(0, 0); return; }

  const tm = e.target.closest('[data-teach]');
  if (tm && DATA) {
    TEACH = tm.getAttribute('data-teach') === '1';
    if (TEACH) TPHASE = 0;
    render(DATA); window.scrollTo(0, 0); return;
  }

  const tp = e.target.closest('[data-tph]');
  if (tp && DATA) {
    TPHASE = parseInt(tp.getAttribute('data-tph'), 10) || 0;
    render(DATA); window.scrollTo(0, 0); return;
  }

  // A phase's own button opens the deck at that phase rather than a
  // standalone card, so moving on does not mean closing and hunting.
  const pj = e.target.closest('[data-proj]');
  if (pj && DATA) {
    openDeck(parseInt(pj.getAttribute('data-proj'), 10) || 0);
    return;
  }
  const pnx = e.target.closest('[data-projpart]');
  if (pnx && DATA) { openDeck(parseInt(pnx.getAttribute('data-projpart'), 10) || 0); return; }
  if (e.target.closest('[data-projdeck]') && DATA) { openDeck('all'); return; }
  const pg = e.target.closest('[data-projgo]');
  if (pg) { DI += parseInt(pg.getAttribute('data-projgo'), 10); paintSlide(); return; }
  if (e.target.closest('[data-projclose]')) {
    const b = document.querySelector('.proj'); if (b) b.remove();
    DECK = null;
    return;
  }


  const dp = e.target.closest('[data-depth]');
  if (dp && DATA) {
    DEPTH = dp.getAttribute('data-depth');
    try { localStorage.setItem('lk.depth', DEPTH); } catch { /* private window */ }
    render(DATA, true);
    return;
  }
  if (e.target.closest('[data-pack]')) { window.print(); return; }

  const tv = e.target.closest('[data-tv]');
  const tn = e.target.closest('[data-tnote]');
  if (tv || tn) {
    const verdict = tv ? tv.getAttribute('data-tv') : null;
    if (tv) [...$('tverdict').children].forEach((x) => x.classList.toggle('on', x === tv));
    const { error } = await sb.rpc('lk_teacher_verdict', {
      p_token: token, p_verdict: verdict, p_note: tn ? $('tnote').value.trim() : null,
    });
    $('tmsg').textContent = error ? L().saveFail + error.message : L().tThanks;
    return;
  }

  const lcov = e.target.closest('[data-lcov]');
  const lleft = e.target.closest('[data-lleft]');
  if (lcov || lleft) {
    if (lcov) {
      COV = lcov.getAttribute('data-lcov');
      [...$('covrow').children].forEach((b) => b.classList.toggle('on', b === lcov));
    }
    if (lleft) LEFT = $('leftoff').value.trim();
    const { error } = await sb.rpc('lk_linked_coverage', { p_token: token, p_coverage: COV || null, p_left_off: LEFT || null });
    $('lratemsg').textContent = error ? L().saveFail + error.message : L().thanks;
    return;
  }
  const asp = e.target.closest('[data-asp]');
  if (asp) {
    const parts = asp.getAttribute('data-asp').split(':');
    ASPECTS[parts[0]] = parts[1];
    [...$('q-' + parts[0]).children].forEach((x) => x.classList.toggle('on', x === asp));
    // "No" and "with changes" are the answers worth a reason, so ask then.
    if (parts[0] === 'reuse') {
      $('why').hidden = parts[1] === 'yes';
      $('saybox').hidden = false;
    }
    const { error } = await sb.rpc('lk_rate_aspects_by_token', {
      p_token: token, p_session: SESSION, p_reuse: ASPECTS.reuse || null,
      p_clarity: ASPECTS.clarity || null, p_timefit: ASPECTS.timefit || null,
    });
    const done = !!ASPECTS.reuse;
    $('ratemsg').textContent = error ? L().saveFail + error.message : (done ? L().thanks : L().savedSoFar);
    return;
  }
  const cov = e.target.closest('[data-cov]');
  const lo = e.target.closest('[data-leftoff]');
  if (cov || lo) {
    if (cov) {
      COV = cov.getAttribute('data-cov');
      document.querySelectorAll('#covrow button').forEach((b) => b.classList.toggle('on', b === cov));
    }
    LEFT = $('leftoff')?.value || '';
    if (!COV) return;
    const { error } = await sb.rpc('lk_rate_coverage_by_token', { p_token: token, p_coverage: COV, p_left_off: LEFT });
    $('ratemsg').textContent = error ? l.saveFail + error.message : l.thanks;
    return;
  }
  const pick = e.target.closest('[data-pick]');
  if (pick && DATA) {
    LANG = pick.getAttribute('data-pick');
    try { localStorage.setItem('lk.lang', LANG); } catch { /* private window */ }
    render(DATA);
    window.scrollTo(0, 0);
    return;
  }

  const a = e.target.closest('[data-assist]');
  if (a) {
    return runAssist({
      kind: a.getAttribute('data-assist'),
      ref: a.getAttribute('data-ref'),
      label: a.getAttribute('data-label'),
      variant: a.getAttribute('data-variant') || '',
      text: a.closest('.phase, .ps')?.innerText?.slice(0, 1200) || '',
    });
  }

  const fill = e.target.closest('[data-fill]');
  if (fill) {
    return runAssist({
      kind: 'filler', ref: 'lesson', label: l.barLbl,
      minutes: Number(fill.getAttribute('data-fill')),
    });
  }

  if (e.target.closest('[data-sheetclose]') || e.target.id === 'sheet') {
    $('sheet').hidden = true;
    return;
  }

  const noteBtn = e.target.closest('[data-note]');
  if (noteBtn) {
    const val = $('noteq')?.value || '';
    if (!val.trim()) return;
    noteBtn.disabled = true;
    const { data, error } = await sb.rpc('lk_extra_note', {
      p_token: token, p_extra_id: Number(noteBtn.getAttribute('data-note')), p_note: val,
    });
    $('notemsg').textContent = (error || !data) ? l.saveFail + (error?.message || '') : l.noteSaved;
    return;
  }

  const sayBtn = e.target.closest('[data-comment]');
  if (sayBtn) {
    const val = $('say')?.value || '';
    if (!val.trim()) return;
    sayBtn.disabled = true;
    const { error } = await sb.rpc('lk_rate_comment_by_token', { p_token: token, p_comment: val });
    $('ratemsg').textContent = error ? l.saveFail + error.message : l.thanks;
    return;
  }

  const reason = e.target.closest('[data-reason]');
  if (reason) {
    const k = reason.getAttribute('data-reason');
    if (REASONS.has(k)) { REASONS.delete(k); reason.classList.remove('on'); }
    else { REASONS.add(k); reason.classList.add('on'); }
    const { error } = await sb.rpc('lk_rate_reasons_by_token', {
      p_token: token, p_reasons: [...REASONS],
    });
    $('ratemsg').textContent = error ? l.saveFail + error.message : l.thanks;
    return;
  }

  const v = e.target.closest('[data-reuse]');
  if (v) {
    const reuse = v.getAttribute('data-reuse') === '1';
    [...document.querySelectorAll('#verdict button')].forEach((b) => b.classList.remove('on'));
    v.classList.add('on');
    $('why').hidden = reuse;              // only ask why when something was off
    $('saybox').hidden = false;           // but always offer the sentence
    REASONS = new Set();
    const { error } = await sb.rpc('lk_rate_by_token_v2', {
      p_token: token, p_reuse: reuse, p_reasons: [],
    });
    $('ratemsg').textContent = error ? l.saveFail + error.message : l.thanks;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') $('sheet').hidden = true;
});

load();
</script>
</body>
</html>
