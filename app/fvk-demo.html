<title>Lektionskollen i Frånvarokollen (testsida)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<meta name="lk-build" content="dcc793f658ab">
<script>
// ── Is this page the one we deployed? ─────────────────────
// GitHub Pages serves HTML with cache-control: max-age=600 and gives us no way
// to change that, so a link opened the day after it was sent can render the
// previous build. The page carries the build it was made from and asks.
//
// Two things make the answer trustworthy. cache:'no-store' keeps the browser
// from answering out of its own cache, and the timestamp makes the URL one the
// CDN has never seen, so it cannot answer from the edge either. Without the
// timestamp version.txt would be cached for the same ten minutes as the page it
// is meant to police.
//
// A failed fetch means offline, and offline is exactly when the cached page is
// the right thing to show. So it is ignored.
(function () {
  var BUILD = document.querySelector('meta[name="lk-build"]').content;
  if (!BUILD) return;
  try { if (sessionStorage.getItem('lk.sawBuild') === BUILD) return; } catch (e) { /* private window */ }
  fetch('./version.txt?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (live) {
      if (!live) return;
      live = live.trim();
      if (!live || live === BUILD) return;
      // Remember the build we are leaving, so a reload that somehow lands on it
      // again stops here instead of looping.
      try { sessionStorage.setItem('lk.sawBuild', BUILD); } catch (e) { /* ignore */ }
      var u = new URL(location.href);
      u.searchParams.set('_v', live);
      location.replace(u.toString());
    })
    .catch(function () { /* offline: the cached page is the point */ });
})();
</script>
</head>
<body data-shell="fvk">

<!-- TEST PAGE: Lektionskollen inside a copy of Frånvarokollen, so the
     integration can be judged. The product is index.html. -->

<!-- Sign-in (mocked). Lektionskollen's own sign-in for schools without
     Frånvarokollen; inside FVK this never shows. See docs/AUTH.md. -->
<div class="signin" id="signin" hidden>
  <div class="si-card">
    <div class="si-brand"><span class="si-mark">LK</span><span>Lektionskollen</span>
      <span class="si-lang"><button data-lang="sv">SV</button><button data-lang="en">EN</button></span></div>
    <h2 data-t="siTitle">Logga in</h2>
    <p class="hint" data-t="siLead"></p>
    <button class="si-btn" data-signin="google"><span class="si-ico g">G</span><span data-t="siGoogle">Fortsätt med Google</span></button>
    <button class="si-btn" data-signin="microsoft"><span class="si-ico ms"><i></i><i></i><i></i><i></i></span><span data-t="siMicrosoft">Fortsätt med Microsoft</span></button>
    <div class="si-or"><span data-t="siOr">eller</span></div>
    <div class="si-email">
      <input id="si-email" type="email" autocomplete="email" placeholder="namn@skola.se">
      <button class="btn btn-ghost" data-signin="email" data-t="siEmailBtn">Skicka länk</button>
    </div>
    <p class="si-fvk" data-t="siFvk"></p>
    <div class="si-demo">
      <span class="chip chip-warn" data-t="siMockChip">Demo</span>
      <span class="hint" data-t="siMockNote"></span>
      <button class="btn btn-primary btn-sm" data-signin="demo" data-t="siDemo">Öppna demoskolan</button>
    </div>
  </div>
</div>

<div class="shell" id="app">
  <aside class="sidebar">
    <div class="sb-top">
      <img src="./logo-white.svg" alt="FrånvaroKollen" class="sb-logo">
      <p class="sb-school" id="schoolname">…</p>
    </div>

    <div class="sb-nav-wrap">
      <p class="navlabel" data-t="navSection">Navigering</p>
      <nav class="nav" id="nav"></nav>
    </div>

    <div class="sb-divider"></div>

    <div class="sb-lang">
      <div class="langbox">
        <button class="langbtn" data-lang="sv">SV</button>
        <button class="langbtn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="sb-user">
      <div class="userrow">
        <div class="avatar" id="avatar">TS</div>
        <div class="userinfo"><p id="username">…</p><p class="userauth" id="userauth"></p></div>
        <button class="signout" id="signout" data-t="signOut">Logga ut</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pagetitle">Daglig vikarie</h1>
        <div class="sub mono" id="pagesub">—</div>
      </div>
      <div class="spacer"></div>
    </header>

    <div class="wrap">
      <section id="screen-cover">
        <div class="demo-tip">
          <span>▶</span>
          <div><b data-t="demoTipTitle">Delad testmiljö — ingen inloggning.</b> <span data-t="demoTipBody"></span></div>
        </div>
        <div class="tabs">
          <button class="on" data-t="tabDaily">Daglig vikarie</button>
          <button disabled data-t="tabSubs">Vikarier</button>
          <button disabled data-t="tabLongTerm">Långtidsfrånvaro</button>
        </div>
        <!-- Cover header: date, coverage donut, counts, day actions -->
        <div class="cvhead">
          <div class="cvdate">
            <p class="cvkicker" id="cv-kicker">IDAG · VECKA 43</p>
            <h1 id="cv-day"></h1>
          </div>
          <div class="cvright">
            <div class="cvstats">
              <svg id="cv-donut" width="72" height="72" viewBox="0 0 72 72"></svg>
              <div>
                <p class="cvneed" id="cv-need"></p>
                <p class="cvcounts" id="cv-counts"></p>
              </div>
            </div>
            <div class="cvacts">
              <button class="btn btn-ghost btn-sm" disabled data-t="cvAddAbsence">Lägg till frånvaro</button>
              <button class="btn btn-cta btn-sm" disabled data-t="cvCoverExt">Täck allt externt</button>
              <button class="btn btn-ghost btn-sm" disabled data-t="cvDayNotes">Dagsanteckningar</button>
            </div>
          </div>
        </div>

        <!-- Covered lessons with no plan — the loudest of the three placements -->
        <div class="nudge" id="cv-nudge" hidden></div>

        <!-- Absent staff chips -->
        <div class="chipstrip" id="cv-chips"></div>

        <!-- View toggle -->
        <div class="cvtoggle">
          <button class="on" data-t="cvTimeline">Tidslinje</button>
          <button disabled data-t="cvByTeacher">Per lärare</button>
          <span class="spacer"></span>
          <button class="addlesson" disabled>+ <span data-t="cvAddLesson">Lägg till lektion</span></button>
        </div>

        <!-- Timeline grid: one column per absent teacher -->
        <div class="gridwrap card-elevated"><div class="gridinner" id="cv-grid"></div></div>
        <p class="note" data-t="cvGridNote"></p>

        <!-- Not part of Frånvarokollen: the design question this replica asks -->
        <div class="loudpick" id="cv-loud"></div>
      </section>

      <section id="screen-plans" hidden>
        <div class="tabs plantabs">
          <button class="on" data-tab="bank" data-t="tabBank">Lektionsbank</button>
          <button data-tab="feedback"><span data-t="tabFeedback">Återkoppling</span><span class="tbadge" id="tabbadge" hidden></span></button>
          <button data-tab="term" data-t="tabTerm">Terminsplanering</button>
        </div>

      <div id="tab-bank">
        <div class="filters">
          <div class="seg" id="poolview"></div>
          <select id="f-scope"></select>
          <select id="f-origin" hidden></select>
          <select id="f-approval"></select>
          <span class="spacer"></span>
          <button class="btn btn-ghost btn-sm" id="refreshbank" data-t="refresh">Uppdatera</button>
          <button class="btn btn-primary btn-sm" data-create=""><span>+ </span><span data-t="crCreate">Skapa lektionsplan</span></button>
        </div>
        <div id="bankgrid"></div>
        <p class="note" data-t="poolGroupNote"></p>
        <p class="note" data-t="thresholdNote"></p>
        <p class="note" data-t="rankNote"></p>
      </div>

      <div id="tab-feedback" hidden>
        <!-- A short to-do list, usually empty: the routine is decided for you. -->
        <div id="fbsummary"></div>
        <div class="filters" style="margin-top:14px"><h3 class="fb-h" data-t="fbNeedsH">Behöver dig</h3><span class="spacer"></span>
          <button class="btn btn-ghost btn-sm" data-tab="feedback" data-t="refresh">Uppdatera</button></div>
        <div class="grid" id="fbqueue"></div>
        <details class="fbmore"><summary data-t="plansTitle">Planer och vad vikarierna sa</summary><div class="grid" id="fbplans"></div></details>
        <details class="fbmore"><summary id="fbautoH"></summary><div class="grid" id="fbauto"></div></details>
        <div class="bcard fx" id="fbsettings" style="margin-top:22px;max-width:520px"></div>
      </div>

      <!-- The department's own year planning. Not a plan, not a document: the
           one shape every school's planning gets reduced to, so a generated
           lesson can follow on from what the class actually did. -->
      <div id="tab-term" hidden>
        <div class="filters">
          <select id="tp-subject"></select>
          <select id="tp-year"></select>
          <span class="spacer"></span>
          <button class="btn btn-ghost btn-sm" id="tp-reload" data-t="refresh">Uppdatera</button>
        </div>
        <p class="note" data-t="tpWhy"></p>
        <div id="tp-cov" style="margin-bottom:18px"></div>
        <div class="bcard fx" style="max-width:900px">
          <h4 data-t="tpPasteH">Klistra in planeringen</h4>
          <p class="hint" data-t="tpPasteNote"></p>
          <textarea id="tp-raw" rows="8" class="tp-raw"></textarea>
          <div class="strow" style="margin-top:10px">
            <button class="btn btn-primary btn-sm" id="tp-read" data-t="tpRead">Läs in</button>
            <button class="btn btn-ghost btn-sm" id="tp-pick" data-t="tpPick">Välj fil</button>
            <input type="file" id="tp-file" accept=".csv,.tsv,.txt,text/plain" hidden>
          </div>
        </div>
        <div id="tp-preview"></div>
        <div id="tp-stored" style="margin-top:22px"></div>
      </div>
      </section>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="addin" role="dialog" aria-modal="true" aria-labelledby="addin-title">
    <div class="seam">
      <span class="tag">Lektionskollen</span>
      <span data-t="seam"></span>
      <span class="spacer"></span>
      <span id="seam-state">—</span>
    </div>
    <div id="addin-content"></div>
  </div>
</div>

<!-- Assist results open over the plan, never inline: you must not lose
     your place in a document you are reading live. -->
<div class="sheet" id="assist-sheet" hidden>
  <div class="card">
    <button class="x" data-assistclose aria-label="Stäng">✕</button>
    <div id="assist-sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./i18n.js"></script>
<script src="./plan-view.js"></script>
<script src="./lk.js"></script>
<!-- Linking a plan the school already has -->
<div class="linkbox" id="linkbox" hidden></div>

<!-- Frånvarokollen's lesson popover -->
<div class="cvpop" id="cv-pop" hidden></div>

</body>
</html>
